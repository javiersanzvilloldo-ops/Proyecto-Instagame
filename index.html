<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Instagame - Live Demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: Arial; max-width: 800px; margin: 0 auto; padding: 20px; }
    .hero { text-align: center; background: #1e3a8a; color: white; padding: 50px; }
    .features { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
    .card { border: 1px solid #ccc; padding: 20px; border-radius: 8px; }
    a { color: #3b82f6; text-decoration: none; }
  </style>
</head>
<body>
  <div class="hero">
    <h1>🎮 Instagame</h1>
    <p>Red social para gamers | React + Node + MySQL</p>
  </div>
  
  <h2>Funcionalidades</h2>
  <div class="features">
    <div class="card">
      <h3>📱 Login/Registro</h3>
      <p>Autenticación JWT segura</p>
    </div>
    <div class="card">
      <h3>📸 Posts & Feed</h3>
      <p>Sube juegos, imágenes, like/comenta</p>
    </div>
    <div class="card">
      <h3>⚙️ API REST</h3>
      <p>CRUD completo Express + MySQL</p>
    </div>
  </div>
  
  <footer style="text-align: center; margin-top: 50px;">
    <a href="https://github.com/javiersanzvilloldo-ops/Proyecto-Instagame">Ver Código</a> | 
    Bootcamp Socratech 2025
  </footer>
</body>
</html>
